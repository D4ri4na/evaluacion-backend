server {
    listen 80;
    server_tokens off; # OCULTA LA VERSIÓN DE NGINX (Regla de la rúbrica)

    # Nginx sirve los archivos estáticos de Django DIRECTAMENTE del disco
    location /static/ {
        alias /app/static/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /admin/ {
        proxy_pass http://admin:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}