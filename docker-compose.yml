services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_design/tickets_database.ddl:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

  admin:
    build: ./admin_panel
    container_name: django_admin
    restart: always
    ports: []
    volumes:
      - ./admin_panel:/app
      - static_volume:/app/static  
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=settings
    depends_on:
      - db

  api:
    build: ./api
    container_name: fastapi_backend
    restart: always
    ports: []
    volumes:
      - ./api:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: web_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      - api
      - admin

volumes:
  postgres_data:
  static_volume: 